services:
  app:
    image: lazy247/sportshop-app:latest

    container_name: sportshop-app-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:mysql://mysql:3306/sportshop'
      SPRING_DATASOURCE_USERNAME: 'root'
      SPRING_DATASOURCE_PASSWORD: '123456'
      VNPAY_RETURN_URL: 'http://192.168.10.205:8080/order/payment-return'
      SPRING_AUTOCONFIGURE_EXCLUDE: 'org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration'
  mysql:
    image: mysql:9.4
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: 'sportshop'
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
